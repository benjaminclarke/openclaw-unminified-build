# benbox: build an OpenClaw release from its upstream tag WITHOUT the local-identifier mangling
# added in 2026.11.5, so benbox's content-anchored dist ports keep working (Ben 2026-11-19).
# Lives alone on this fork's default branch: upstream's own workflows never run here.
# Source of truth: benjaminclarke/openclaw (private ops repo) update/weekly/unminified-build/.
name: unminified-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "OpenClaw release tag, e.g. v2026.11.5"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}$ ]] || { echo "bad tag: $TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.tag }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"   # upstream's openclaw-npm-release NODE_VERSION

      - name: Turn off identifier mangling (the only change to upstream)
        working-directory: src
        run: node ../tools/scripts/unminify.mjs tsdown.config.ts --allow-absent

      - name: Install (frozen lockfile, packageManager-pinned pnpm)
        working-directory: src
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        working-directory: src
        run: pnpm build

      # Not `npm pack`: upstream's prepack refuses a plain root pack (the workspace dep
      # @openclaw/ai is published separately by their release automation). benbox only swaps
      # dist/ into a tree installed from npm, so dist/ + package.json is the whole artifact.
      - name: Pack dist
        working-directory: src
        run: |
          mkdir -p ../out
          tar -czf "../out/openclaw-${TAG}-dist-unminified.tgz" dist package.json
          cd ../out
          sha256sum *.tgz > SHA256SUMS
          {
            echo "tag=$TAG"
            echo "commit=$(git -C ../src rev-parse HEAD)"
            echo "node=$(node -v)"
            echo "pnpm=$(cd ../src && pnpm -v)"
            echo "built_at=$(date -u +%FT%TZ)"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > BUILD-INFO
          cat BUILD-INFO SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-${{ inputs.tag }}-unminified
          path: out/
          retention-days: 30
          if-no-files-found: error
